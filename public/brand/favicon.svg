<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Awning Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Glow for coin/counter -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Store Interior Backdrop -->
    <linearGradient id="interiorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
  </defs>

  <!-- App Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffedd5" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle Rim Light Top Highlight -->
  <path d="M 16 3 L 48 3 Q 61 3 61 16 L 61 22 Q 44 8 20 8 Q 10 8 3 17 L 3 16 Q 3 3 16 3 Z" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Store Front Window Cutout -->
  <rect x="11" y="25" width="42" height="27" rx="5" fill="url(#interiorGrad)"/>

  <!-- Store Window Counter / Table -->
  <rect x="13" y="42" width="38" height="8" rx="2" fill="#78350f"/>
  <rect x="14" y="42" width="36" height="2" fill="#d97706"/>

  <!-- Store Counter Shopping Basket / Coin Symbol (Bold "T" + Cart) -->
  <!-- Stylized modern "T" in gold with retail coin outline -->
  <g filter="url(#softShadow)">
    <circle cx="32" cy="35" r="9.5" fill="url(#goldGrad)"/>
    <circle cx="32" cy="35" r="8" fill="#ca8a04"/>
    <!-- Crisp bold T symbol -->
    <path d="M 27 30 L 37 30 L 37 33 L 33.5 33 L 33.5 40 L 30.5 40 L 30.5 33 L 27 33 Z" fill="#ffffff"/>
  </g>

  <!-- Awning (Sari-Sari Store Tolda Roof) with Stripes -->
  <g filter="url(#softShadow)">
    <!-- Awning Base Eaves -->
    <path d="M 8 16 L 56 16 L 53 27 Q 53 29 50 29 Q 47 29 47 27 Q 47 29 44 29 Q 41 29 41 27 Q 41 29 38 29 Q 35 29 35 27 Q 35 29 32 29 Q 29 29 29 27 Q 29 29 26 29 Q 23 29 23 27 Q 23 29 20 29 Q 17 29 17 27 Q 17 29 14 29 Q 11 29 11 27 L 8 16 Z" fill="#ffffff"/>

    <!-- Red/Orange Stripes on Awning -->
    <!-- Stripe 1 (Left) -->
    <path d="M 12 16 L 19 16 L 18 27 Q 18 29 15.5 29 Q 13 29 13 27 Z" fill="#ea580c"/>
    <!-- Stripe 2 (Center-Left) -->
    <path d="M 25 16 L 31 16 L 30.5 27 Q 30.5 29 28 29 Q 25.5 29 25.5 27 Z" fill="#ea580c"/>
    <!-- Stripe 3 (Center-Right) -->
    <path d="M 37 16 L 43 16 L 42.5 27 Q 42.5 29 40 29 Q 37.5 29 37.5 27 Z" fill="#ea580c"/>
    <!-- Stripe 4 (Right) -->
    <path d="M 49 16 L 55 16 L 52.5 27 Q 52.5 29 50.5 29 Q 48.5 29 48.5 27 Z" fill="#ea580c"/>

    <!-- Awning Top Ridge -->
    <rect x="7" y="14.5" width="50" height="2.5" rx="1.2" fill="#fed7aa"/>
  </g>

  <!-- Sparkle Accent (Top-Right) -->
  <path d="M 50 7 Q 50 11 54 11 Q 50 11 50 15 Q 50 11 46 11 Q 50 11 50 7 Z" fill="#fef08a"/>
</svg>
